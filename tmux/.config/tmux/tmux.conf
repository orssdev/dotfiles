# --- General Settings ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Status Bar ---
set -g status-position top
set -g status-style "fg=white,bg=default"
set -g status-left "#[fg=white,bold] #S #[fg=white,nobold]| "
set -g status-left-length 30
set -g status-right "#[fg=white]%Y-%m-%d %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=white,bold] #I:#W "
set -g pane-border-style "fg=white"
set -g pane-active-border-style "fg=white,bold"
set -g mode-style "fg=black,bg=white"
set -g message-style "fg=black,bg=white,fill=white"
set -g message-command-style "fg=black,bg=white,fill=white"

# --- Key Bindings ---
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left previous-window
bind -n M-Right next-window
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
